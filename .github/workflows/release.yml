name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e 'const v = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${v}`) throw new Error(`Expected release tag v${v}`);'
      - run: npm run typecheck
      - run: npm test
      - run: npm run rollup
      - name: Check bundle
        run: |
          node --check dist/wiser-zigbee-card.js
          node -e 'const fs = require("node:fs"); const v = require("./package.json").version; if (!fs.readFileSync("dist/wiser-zigbee-card.js", "utf8").startsWith(`/*! WISER-CARD-VERSION wiser-zigbee-card ${v} */`)) throw new Error("Bundle version mismatch");'
      - name: Upload card bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/wiser-zigbee-card.js --clobber
